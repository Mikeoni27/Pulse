<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pulse{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Nav -->
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold text-indigo-600">Pulse</a>
            <div class="flex items-center gap-4">
                {% if current_user %}
                    <a href="/dashboard" class="text-gray-700 hover:text-indigo-600">Dashboard</a>
                    <a href="/pricing" class="text-gray-700 hover:text-indigo-600">Pricing</a>
                    <span class="text-gray-400">|</span>
                    <span class="text-sm text-gray-500">{{ current_user.email }}</span>
                    <form method="post" action="/logout" class="inline">
                        <button type="submit" class="text-sm text-gray-500 hover:text-red-600">Logout</button>
                    </form>
                {% else %}
                    <a href="/pricing" class="text-gray-700 hover:text-indigo-600">Pricing</a>
                    <a href="/login" class="text-gray-700 hover:text-indigo-600">Login</a>
                    <a href="/register" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">Sign up</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Flash messages -->
    {% if error %}
        <div class="max-w-6xl mx-auto mt-4 px-4">
            <div class="bg-red-50 border border-red-200 text-red-800 px-4 py-3 rounded-lg">
                {{ error }}
            </div>
        </div>
    {% endif %}
    {% if success %}
        <div class="max-w-6xl mx-auto mt-4 px-4">
            <div class="bg-green-50 border border-green-200 text-green-800 px-4 py-3 rounded-lg">
                {{ success }}
            </div>
        </div>
    {% endif %}

    <!-- Content -->
    <main class="max-w-6xl mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="max-w-6xl mx-auto px-4 py-8 text-center text-sm text-gray-400">
        Pulse — link attribution platform
    </footer>
</body>
</html>
