{% extends "base.html" %}
{% block title %}Login — Pulse{% endblock %}
{% block content %}

<div class="max-w-md mx-auto bg-white p-8 rounded-lg border border-gray-200 mt-12">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Login to Pulse</h1>

    <form method="post" action="/login" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" name="email" required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" name="password" required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
        </div>
        <button type="submit"
            class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 font-medium">
            Login
        </button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-4">
        No account? <a href="/register" class="text-indigo-600 hover:underline">Sign up</a>
    </p>
</div>

{% endblock %}
